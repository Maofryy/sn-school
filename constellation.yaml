# Source de vérité de la carte. La FigJam en est la vue :
# https://www.figma.com/board/vztbMUfwNHtEaPH5jpjoYv

xp: # par taille
  demi-jour: 50
  1j: 100
  3j: 300
  1sem: 600
  2sem: 1500

anneaux: # seuil d'XP qui ouvre l'anneau ; seul l'XP verrouille
  0: 0
  1: 500
  2: 800
  3: 1500
  4: 2200
  5: 4000

pairs: # pairs requis pour valider, par type
  annexe: 1
  sujet: 2
  jalon: 2 # dont 1 senior
  capstone: 2 # dont 1 senior

# branche : socle | portal | itsm | integrations
# type    : sujet | annexe | jalon | capstone
# liens   : étoiles conseillées avant celle-ci (jamais bloquant)
etoiles:
